<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تجربة حالات المادة الثلاث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--maroon:#8a1538;--gold:#c9a227;--sky:#1b9bd8;--teal:#17a398;--coral:#ef5b3c;--cream:#fffdf8;--sand:#fbf6ec}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
  body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#e6f5fc,transparent 45%),var(--sand);display:flex;align-items:center;justify-content:center;padding:20px;color:#241a14}
  .card{width:100%;max-width:820px;background:var(--cream);border-radius:28px;box-shadow:0 30px 60px -25px rgba(138,21,56,.4);overflow:hidden;border:1px solid rgba(201,162,39,.25)}
  .top{height:8px;background:repeating-linear-gradient(-35deg,var(--maroon) 0 18px,var(--gold) 18px 20px,var(--maroon) 20px 22px)}
  .pad{padding:26px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  h1{color:var(--maroon);font-size:22px;font-weight:900}
  .badge{background:var(--teal);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px}
  .stage{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  @media(max-width:680px){.stage{grid-template-columns:1fr}}
  canvas{width:100%;height:320px;background:linear-gradient(#eaf6fc,#d6ecf7);border-radius:18px;border:2px solid rgba(27,155,216,.25);display:block}
  .panel{display:flex;flex-direction:column;gap:14px}
  .state{border-radius:18px;padding:18px;color:#fff;text-align:center;transition:.4s}
  .state h2{font-size:26px;font-weight:900}
  .state p{font-size:14px;opacity:.95;margin-top:6px;line-height:1.6}
  .thermo{background:#fff;border-radius:18px;padding:16px;border:1px solid #eadfca}
  .thermo label{font-weight:800;color:var(--maroon);display:block;margin-bottom:10px}
  input[type=range]{width:100%;accent-color:var(--coral);height:6px}
  .tval{font-weight:900;font-size:20px;color:var(--coral);text-align:center;margin-top:6px}
  .quick{display:flex;gap:8px;margin-top:12px}
  .quick button{flex:1;border:2px solid #eadfca;background:#fff;border-radius:12px;padding:8px;font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
  .quick button:hover{border-color:var(--sky);transform:translateY(-2px)}
  .tip{margin-top:16px;background:#fff8e6;border-right:5px solid var(--gold);padding:12px 15px;border-radius:12px;font-weight:600;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="top"></div>
  <div class="pad">
    <div class="head"><h1>🧊 تجربة حالات المادة الثلاث 💧💨</h1><span class="badge">تجربة عملية</span></div>
    <div class="stage">
      <div>
        <canvas id="c" width="480" height="320"></canvas>
        <div class="tip" id="tip"></div>
      </div>
      <div class="panel">
        <div class="state" id="state"></div>
        <div class="thermo">
          <label>🌡️ درجة الحرارة — حرّك المؤشّر:</label>
          <input type="range" id="t" min="-20" max="120" value="20" />
          <div class="tval"><span id="tv">20</span> °م</div>
          <div class="quick">
            <button onclick="set(-10)">❄️ صلبة</button>
            <button onclick="set(50)">💧 سائلة</button>
            <button onclick="set(110)">💨 غازية</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=cv.width,H=cv.height,N=90;
const parts=[];
for(let i=0;i<N;i++)parts.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0, hx:0,hy:0});
let temp=20;
const STATES={
  solid:{name:"الحالة الصلبة",bg:"linear-gradient(135deg,#1b9bd8,#0f6fa0)",color:"#1b9bd8",
    p:"الجُسيمات متراصّة ومنتظمة تهتزّ في مكانها فقط — لذا للمادة الصلبة شكل وحجم ثابتان.",
    tip:"مثال: مكعّب الثلج. الجُسيمات قريبة جدًا ومرتبة في صفوف."},
  liquid:{name:"الحالة السائلة",bg:"linear-gradient(135deg,#17a398,#0d7a70)",color:"#17a398",
    p:"الجُسيمات متقاربة لكنها تنزلق فوق بعضها — للسائل حجم ثابت ويأخذ شكل الإناء.",
    tip:"مثال: الماء. الجُسيمات تتحرك بحرية أكبر لكنها تبقى متلامسة."},
  gas:{name:"الحالة الغازية",bg:"linear-gradient(135deg,#ef5b3c,#c93b20)",color:"#ef5b3c",
    p:"الجُسيمات متباعدة وتتحرك بسرعة في كل الاتجاهات — للغاز لا شكل ولا حجم ثابت.",
    tip:"مثال: بخار الماء. الجُسيمات تملأ كل الفراغ المتاح لها."}
};
function currentState(){return temp<0?'solid':temp<100?'liquid':'gas';}
function assignHome(){
  // lattice positions for solid
  const cols=Math.ceil(Math.sqrt(N));const gap=42;const ox=W/2-(cols-1)*gap/2;const oy=H/2-(cols-1)*gap/2;
  parts.forEach((p,i)=>{p.hx=ox+(i%cols)*gap;p.hy=oy+Math.floor(i/cols)*gap;});
}
assignHome();
function updateUI(){
  const s=STATES[currentState()];
  const el=document.getElementById('state');
  el.style.background=s.bg;
  el.innerHTML=`<h2>${s.name}</h2><p>${s.p}</p>`;
  document.getElementById('tip').innerHTML="💡 "+s.tip;
}
function tick(){
  const st=currentState();
  const speed=st==='solid'?0.6:st==='liquid'?2.2:5.5;
  x.clearRect(0,0,W,H);
  parts.forEach(p=>{
    if(st==='solid'){
      p.x+=(p.hx-p.x)*0.08+(Math.random()-.5)*speed;
      p.y+=(p.hy-p.y)*0.08+(Math.random()-.5)*speed;
    }else{
      p.vx+=(Math.random()-.5)*speed*0.6;p.vy+=(Math.random()-.5)*speed*0.6;
      p.vx*=0.96;p.vy*=0.96;
      if(st==='liquid'){p.vy+=0.15;} // gravity for liquid settling
      p.x+=p.vx;p.y+=p.vy;
      if(st==='liquid'&&p.y>H-10){p.y=H-10;p.vy*=-0.3;}
      if(p.x<8){p.x=8;p.vx*=-1;}if(p.x>W-8){p.x=W-8;p.vx*=-1;}
      if(p.y<8){p.y=8;p.vy*=-1;}if(p.y>H-8){p.y=H-8;p.vy*=-1;}
    }
    const col=st==='solid'?'#1b9bd8':st==='liquid'?'#17a398':'#ef5b3c';
    x.beginPath();x.arc(p.x,p.y,7,0,7);x.fillStyle=col;x.fill();
    x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=2;x.stroke();
  });
  requestAnimationFrame(tick);
}
function set(v){document.getElementById('t').value=v;temp=v;document.getElementById('tv').textContent=v;updateUI();}
document.getElementById('t').addEventListener('input',e=>{temp=+e.target.value;document.getElementById('tv').textContent=temp;updateUI();});
updateUI();tick();
</script>
</body>
</html>
