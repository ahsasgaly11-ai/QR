<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="منصة منهاج قطر التفاعلية">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a1538"/>
      <stop offset="1" stop-color="#5f0e26"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- flag serration accent -->
  <g fill="#c9a227">
    <rect x="64" y="404" width="384" height="10" rx="5" opacity="0.5"/>
  </g>
  <!-- atom / science orbits -->
  <g fill="none" stroke="#ffffff" stroke-width="16" opacity="0.95">
    <ellipse cx="256" cy="240" rx="150" ry="60"/>
    <ellipse cx="256" cy="240" rx="150" ry="60" transform="rotate(60 256 240)"/>
    <ellipse cx="256" cy="240" rx="150" ry="60" transform="rotate(120 256 240)"/>
  </g>
  <circle cx="256" cy="240" r="34" fill="#e7cf6f"/>
  <circle cx="256" cy="240" r="15" fill="#ffffff"/>
</svg>
